# =============================================================================
# 单个应用容器内的 nginx 配置。
# 每个应用（main / sub-vue / sub-react）镜像里都用这一份，
# 因为它只负责"把自己这份 dist 伺服好"。
# 三个应用如何拼成一个站点，由 gateway.conf 决定。
#
# 如果不想上 Docker，直接用单机 nginx 把三个 dist 拼在一起，
# 用 deploy/nginx-standalone.conf。
# =============================================================================
server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_types        text/plain text/css application/javascript application/json
                      application/xml image/svg+xml font/woff font/woff2;

    # 跨域：qiankun 是用 fetch 去拉子应用 HTML 的，这一步就是跨域请求。
    # 用网关反代成同源时可以删掉这几行；直连子应用容器时必须保留。
    add_header Access-Control-Allow-Origin  "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Accept" always;

    # history 路由回退，hash 路由可以省掉这一行
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 contenthash 的静态资源，长缓存 + immutable
    location ~* \.(?:js|css|woff2?|ttf|eot|png|jpe?g|gif|svg|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # index.html 绝不能缓存，否则子应用发版后主应用拿到的还是旧入口
    location ~* /index\.html$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    # runtime-config.js 同理：它是"环境"本身，缓存住就换不了环境了
    location = /runtime-config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    location = /apps.json {
        add_header Cache-Control "no-cache";
        expires -1;
    }
}
