# =============================================================================
# 网关：把三个独立部署的应用拼成一个对用户透明的域名。
#
# 这是"多服务 + 网关"的拓扑：每个应用一个容器、可以独立发布和回滚，
# 网关只做路径分发。和单机 nginx-standalone.conf 的区别是
# 这里的三个应用在物理上是分开的，故障域也分开了。
# =============================================================================

upstream main_app {
    server main:80;
}

upstream sub_vue_app {
    server sub-vue:80;
}

upstream sub_react_app {
    server sub-react:80;
}

server {
    listen       80;
    server_name  _;

    charset utf-8;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/javascript application/json
                    image/svg+xml font/woff font/woff2;

    # ---- 子应用 A ----
    # proxy_pass 结尾带斜杠 = 把 /sub-vue/ 前缀剥掉再转发。
    # 子应用产物里引用资源用的是 publicPath /sub-vue/，
    # 浏览器请求 /sub-vue/js/xxx.js → 网关剥成 /js/xxx.js → 子应用容器正好命中。
    location /sub-vue/ {
        proxy_pass http://sub_vue_app/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- 子应用 B ----
    location /sub-react/ {
        proxy_pass http://sub_react_app/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- 主应用（兜底）----
    location / {
        proxy_pass http://main_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
