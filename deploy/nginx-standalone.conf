# =============================================================================
# 单机 nginx：三份 dist 拼成一个域名（不依赖 Docker）
#
# 假设目录结构（把三个应用各自 npm run build 的产物按下面摆好）：
#   /var/www/mfe/main/index.html
#   /var/www/mfe/sub-vue/index.html
#   /var/www/mfe/sub-react/index.html
#
# 这正是 scripts/serve.mjs 在本地模拟的那套规则。
# =============================================================================
server {
    listen       80;
    server_name  mfe.example.com;

    root  /var/www/mfe;
    index index.html;

    charset utf-8;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types      text/plain text/css application/javascript application/json
                    application/xml image/svg+xml font/woff font/woff2;

    # ---- 主应用 ----
    location / {
        root  /var/www/mfe/main;
        try_files $uri $uri/ /index.html;
    }

    # ---- 子应用 A ----
    # ⚠️ alias 结尾的斜杠必须和 location 一致。
    #    写成 `alias /var/www/mfe/sub-vue;`（少尾斜杠）会变成
    #    /var/www/mfe/sub-vue/sub-vue/xxx，症状是资源全 404。
    location /sub-vue/ {
        alias /var/www/mfe/sub-vue/;
        try_files $uri $uri/ /sub-vue/index.html;
    }

    # ---- 子应用 B ----
    location /sub-react/ {
        alias /var/www/mfe/sub-react/;
        try_files $uri $uri/ /sub-react/index.html;
    }

    # ---- 运行时配置，绝不缓存 ----
    location = /runtime-config.js {
        root  /var/www/mfe/main;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    location = /apps.json {
        root  /var/www/mfe/main;
        add_header Cache-Control "no-cache";
        expires -1;
    }

    # ---- 静态资源长缓存 ----
    location ~* \.(?:js|css|woff2?|ttf|eot|png|jpe?g|gif|svg|webp|ico)$ {
        root  /var/www/mfe/main;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }
}
